name: Validate Repository

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Basic Validation Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: hashFiles('terraform/**/*.tf') != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform fmt check
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform fmt -check -recursive

      - name: Shell script lint
        if: hashFiles('automation/scripts/**/*.sh') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find automation/scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Markdown lint
        run: |
          npm install -g markdownlint-cli
          find . \
            \( -path './.git' -o -path './node_modules' -o -path './.terraform' -o -path './.venv' -o -path './venv' -o -path './dist' -o -path './build' \) -prune -o \
            -type f -name '*.md' -print0 | xargs -0 markdownlint
